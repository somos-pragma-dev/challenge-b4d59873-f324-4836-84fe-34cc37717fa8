---
# Namespace scoped store para aplicaciones que requieren isolation
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: fintech-app-secure-store
  namespace: apps
  annotations:
    description: "Secret Store dedicado para namespace apps con isolation"
    isolation: "strict"
spec:
  provider:
    vault:
      server: "https://vault-primary.us-east-1.fintech.internal:8200"
      
      path: "secret"
      
      version: "v2"
      
      caProvider:
        type: "Secret"
        name: "vault-ca-cert"
        namespace: "vault"
        key: "ca.crt"
      
      auth:
        kubernetes:
          mountPath: "kubernetes"
          
          role: "app-secrets-reader"
          
          serviceAccountRef:
            name: "app-sa"
            namespace: "apps"
      
      # Limitación de acceso solo a secrets específicos de la app
      conditions:
        - expressions:
            - key: "secret/data/apps/*"
      
      enableVaultV2: true
      
      prefix: "secret/data"
---
# Store para credenciales de base de datos con rotación automática
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: fintech-db-credentials
  namespace: databases
  annotations:
    description: "Secret Store para rotación automática de credenciales de base de datos"
    rotation.enabled: "true"
    rotation.interval: "24h"
spec:
  provider:
    vault:
      server: "https://vault-primary.us-east-1.fintech.internal:8200"
      
      path: "secret"
      
      version: "v2"
      
      caProvider:
        type: "Secret"
        name: "vault-ca-cert"
        namespace: "vault"
        key: "ca.crt"
      
      auth:
        kubernetes:
          mountPath: "kubernetes"
          
          role: "db-secrets-manager"
          
          serviceAccountRef:
            name: "db-rotator-sa"
            namespace: "databases"
      
      enableVaultV2: true
      
      prefix: "secret/data"
---
# Configuración de PushSecret para sincronización inversa (clusters -> Vault)
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: fintech-vault-push-store
  namespace: external-secrets
  annotations:
    description: "Secret Store para push de secrets desde clusters a Vault"
    direction: "push"
spec:
  provider:
    vault:
      server: "https://vault-primary.us-east-1.fintech.internal:8200"
      
      path: "secret"
      
      version: "v2"
      
      caProvider:
        type: "Secret"
        name: "vault-ca-cert"
        namespace: "vault"
        key: "ca.crt"
      
      auth:
        kubernetes:
          mountPath: "kubernetes"
          
          role: "external-secrets-pusher"
          
          serviceAccountRef:
            name: "external-secrets-push"
            namespace: "external-secrets"
      
      enableVaultV2: true
      
      prefix: "secret/data"
---