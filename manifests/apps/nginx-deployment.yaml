apiVersion: apps/v1
kind: Deployment
metadata:
  name: fintech-nginx
  namespace: fintech-production
  labels:
    app: fintech-nginx
    tier: frontend
    environment: production
    region: us-east-1
    managed-by: argocd
    fintech.internal/component: web-frontend
    fintech.internal/team: platform-engineering
  annotations:
    description: "Deployment de Nginx como reverse proxy y balanceador para la aplicación fintech"
    owner: "Platform Engineering Team (platform@fintech.internal)"
    maintenance-window: "04:00-06:00 UTC todos los domingos"
    rollback-policy: "auto-rollback en caso de fallo de health check"
    replication-strategy: "active-active en us-east-1 y us-west-2"
    disaster-recovery-tier: "tier-1-critical"
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: fintech-nginx
  template:
    metadata:
      labels:
        app: fintech-nginx
        tier: frontend
        environment: production
        region: us-east-1
        version: v1.4.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9113"
        prometheus.io/path: "/metrics"
        argocd.argoproj.io/compare-options: IgnoreExtraneous
        argocd.argoproj.io/sync-options: Prune=false
    spec:
      serviceAccountName: fintech-nginx-sa
      securityContext:
        runAsNonRoot: false
        fsGroup: 101
        runAsUser: 101
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: fintech-nginx
              topologyKey: topology.kubernetes.io/zone
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 50
            preference:
              matchExpressions:
              - key: node-type
                operator: In
                values:
                - compute-optimized
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: fintech-nginx
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: fintech-nginx
      tolerations:
      - key: "dedicated"
        operator: "Equal"
        value: "frontend"
        effect: "NoSchedule"
      - key: "critical"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 300
      containers:
      - name: nginx
        image: nginx:1.25-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        - name: https
          containerPort: 443
          protocol: TCP
        - name: metrics
          containerPort: 9113
          protocol: TCP
        env:
        - name: NGINX_HOST
          value: "fintech.internal"
        - name: NGINX_PORT
          value: "80"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: REGION
          value: "us-east-1"
        - name: CLUSTER_NAME
          value: "primary-us-east-1"
        - name: VAULT_ADDR
          valueFrom:
            configMapKeyRef:
              name: fintech-config
              key: vault.address
              optional: true
        - name: LOG_LEVEL
          value: "info"
        - name: ENABLE_METRICS
          value: "true"
        - name: ENABLE_TRACING
          value: "true"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
            ephemeral-storage: 100Mi
          limits:
            cpu: 500m
            memory: 512Mi
            ephemeral-storage: 500Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: 80
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 80
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /healthz
            port: 80
            scheme: HTTP
          initialDelaySeconds: 0
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d
          readOnly: true
        - name: nginx-cache
          mountPath: /var/cache/nginx
          readOnly: false
        - name: nginx-run
          mountPath: /var/run
          readOnly: false
        - name: tls-certs
          mountPath: /etc/nginx/ssl
          readOnly: true
        - name: fintech-templates
          mountPath: /usr/share/nginx/html
          readOnly: true
        - name: timezone
          mountPath: /etc/localtime
          readOnly: true
        - name: timezone-data
          mountPath: /usr/share/zoneinfo
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
            add:
            - NET_BIND_SERVICE
      volumes:
      - name: nginx-config
        configMap:
          name: fintech-nginx-config
          defaultMode: 0444
          optional: false
      - name: nginx-cache
        emptyDir:
          medium: Memory
          sizeLimit: 256Mi
      - name: nginx-run
        emptyDir:
          medium: Memory
          sizeLimit: 10Mi
      - name: tls-certs
        secret:
          secretName: fintech-tls-secret
          defaultMode: 0444
          optional: true
      - name: fintech-templates
        configMap:
          name: fintech-templates
          defaultMode: 0444
          optional: true
      - name: timezone
        hostPath:
          path: /etc/localtime
          type: File
      - name: timezone-data
        hostPath:
          path: /usr/share/zoneinfo
          type: Directory
      hostNetwork: false
      dnsPolicy: ClusterFirst
      dnsConfig:
        nameservers:
        - 10.96.0.10
        searches:
        - fintech-production.svc.cluster.local
        - svc.cluster.local
        options:
        - name: ndots
          value: "2"
---
apiVersion: v1
kind: Service
metadata:
  name: fintech-nginx
  namespace: fintech-production
  labels:
    app: fintech-nginx
    tier: frontend
    environment: production
    managed-by: argocd
    fintech.internal/service-type: load-balancer
    fintech.internal/team: platform-engineering
  annotations:
    description: "Servicio ClusterIP para el deployment de Nginx"
    owner: "Platform Engineering Team (platform@fintech.internal)"
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "http"
    service.beta.kubernetes.io/aws-load-balancer-ssl-cert: "arn:aws:acm:us-east-1:123456789012:certificate/abc123"
    service.beta.kubernetes.io/aws-load-balancer-ssl-negotiation-policy: "ELBSecurityPolicy-2016-08"
    service.beta.kubernetes.io/aws-load-balancer-connection-idle-timeout: "4000"
    service.beta.kubernetes.io/aws-load-balancer-proxy-protocol: "*"
    prometheus.io/scrape: "true"
    prometheus.io/port: "9113"
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
    appProtocol: http
  - name: https
    port: 443
    targetPort: https
    protocol: TCP
    appProtocol: https
  - name: metrics
    port: 9113
    targetPort: metrics
    protocol: TCP
    appProtocol: http
  selector:
    app: fintech-nginx
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  publishNotReadyAddresses: false
  externalTrafficPolicy: Cluster
  internalTrafficPolicy: Cluster
---
apiVersion: v1
kind: Service
metadata:
  name: fintech-nginx-nodeport
  namespace: fintech-production
  labels:
    app: fintech-nginx
    tier: frontend
    environment: production
    managed-by: argocd
    fintech.internal/service-type: node-port
  annotations:
    description: "Servicio NodePort para acceso interno durante mantenimiento"
    owner: "Platform Engineering Team"
spec:
  type: NodePort
  ports:
  - name: http
    nodePort: 30080
    port: 80
    targetPort: http
    protocol: TCP
  - name: https
    nodePort: 30443
    port: 443
    targetPort: https
    protocol: TCP
  selector:
    app: fintech-nginx
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fintech-nginx-hpa
  namespace: fintech-production
  labels:
    app: fintech-nginx
    managed-by: argocd
  annotations:
    description: "HPA para escalamiento automático basado en CPU y memoria"
    owner: "Platform Engineering Team"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fintech-nginx
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  - type: Pods
    pods:
      metric:
        name: http_requests_per_second
      target:
        type: AverageValue
        averageValue: 1000m
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60
      - type: Pods
        value: 4
        periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Min
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: fintech-nginx-pdb
  namespace: fintech-production
  labels:
    app: fintech-nginx
    managed-by: argocd
  annotations:
    description: "PDB para garantizar disponibilidad durante actualizaciones"
    owner: "Platform Engineering Team"
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: fintech-nginx
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fintech-nginx-config
  namespace: fintech-production
  labels:
    app: fintech-nginx
    managed-by: argocd
  annotations:
    description: "Configuración principal de Nginx"
    owner: "Platform Engineering Team"
data:
  default.conf: |-
    server_tokens off;
    client_max_body_size 10M;
    client_body_buffer_size 128k;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    send_timeout 60s;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    upstream backend {
        least_conn;
        server backend-1.fintech.internal:8080 max_fails=3 fail_timeout=30s;
        server backend-2.fintech.internal:8080 max_fails=3 fail_timeout=30s;
        server backend-3.fintech.internal:8080 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name fintech.internal api.fintech.internal;

        location /healthz {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location /ready {
            access_log off;
            proxy_pass http://backend/ready;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location /metrics {
            proxy_pass http://127.0.0.1:9113/metrics;
            proxy_set_header Host $host;
        }
    }
  ssl.conf: |-
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;
---
apiVersion: v1
kind: Secret
metadata:
  name: fintech-tls-secret
  namespace: fintech-production
  labels:
    app: fintech-nginx
    managed-by: argocd
  annotations:
    description: "Secretos TLS para HTTPS (gestionado por Vault + external-secrets)"
    owner: "Security Team"
type: kubernetes.io/tls
stringData:
  # Los certificados se inyectan automaticamente desde Vault
  # mediante external-secrets-operator
  # Este es un placeholder para validacion de esquema
  tls.crt: "placeholder"
  tls.key: "placeholder"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fintech-nginx-role
  namespace: fintech-production
  labels:
    app: fintech-nginx
  annotations:
    description: "Rol a nivel de namespace para el deployment de Nginx"
    owner: "Platform Engineering Team"
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets", "services"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch", "update", "patch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fintech-nginx-rolebinding
  namespace: fintech-production
  labels:
    app: fintech-nginx
  annotations:
    description: "RoleBinding para asociar el service account con su rol"
    owner: "Platform Engineering Team"
subjects:
- kind: ServiceAccount
  name: fintech-nginx-sa
  namespace: fintech-production
roleRef:
  kind: Role
  name: fintech-nginx-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fintech-nginx-sa
  namespace: fintech-production
  labels:
    app: fintech-nginx
  annotations:
    description: "Service account dedicado para el deployment de Nginx"
    owner: "Platform Engineering Team"
    iam.amazonaws.com/role: "arn:aws:iam::123456789012:role/fintech-nginx-role"
imagePullSecrets:
- name: fintech-registry-secret