apiVersion: v1
kind: ConfigMap
metadata:
  name: anti-split-brain-config
  namespace: disaster-recovery
  annotations:
    description: "Configuración del mecanismo de quorum para evitar split-brain"
    documentation: "https://fintech.internal/docs/anti-split-brain"
data:
  quorum-config.yaml: |
    quorum:
      algorithm: raft
      clusterSize: 3
      quorumSize: 2
      heartbeatInterval: 1s
      electionTimeout: 5s
      maxLogEntries: 1000
      
    etcd:
      endpoints:
        - https://etcd-0.fintech.internal:2379
        - https://etcd-1.fintech.internal:2379
        - https://etcd-2.fintech.internal:2379
      autoCompactionMode: periodic
      autoCompactionRetention: 1h
      quotaBackendBytes: 8589934592
      
    fencing:
      enabled: true
      fencingTimeout: 10s
      releaseTimeout: 30s
      maxFenceRetries: 3
      
    splitBrainDetection:
      enabled: true
      checkInterval: 5s
      alertThreshold: 2
      autoHealEnabled: true
    
    logging:
      level: info
      format: json
      output: stdout
---
