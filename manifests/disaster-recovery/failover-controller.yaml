apiVersion: apps/v1
kind: Deployment
metadata:
  name: failover-controller
  namespace: disaster-recovery
  labels:
    app: failover-controller
    component: disaster-recovery
    version: v1.0.0
  annotations:
    description: "Controller de failover que gestiona la promoción de clusters standby"
    owner: "sre-team@fintech.internal"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: failover-controller
  template:
    metadata:
      labels:
        app: failover-controller
        component: disaster-recovery
        version: v1.0.0
    spec:
      serviceAccountName: failover-controller
      priorityClassName: system-cluster-critical
      terminationGracePeriodSeconds: 60
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: failover-controller
                topologyKey: kubernetes.io/hostname
      containers:
        - name: controller
          image: fintech.azurecr.io/failover-controller:v1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: metrics
              protocol: TCP
            - containerPort: 8443
              name: webhook
              protocol: TCP
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CONTROLLER_CONFIG_PATH
              value: /config/config.yaml
            - name: LOG_LEVEL
              value: "info"
            - name: HEALTH_CHECK_TIMEOUT
              value: "180"
            - name: ETCD_ENDPOINTS
              value: "https://etcd-0.fintech.internal:2379,https://etcd-1.fintech.internal:2379,https://etcd-2.fintech.internal:2379"
            - name: ETCD_CA_PATH
              value: /etc/etcd/tls/ca.crt
            - name: ETCD_CERT_PATH
              value: /etc/etcd/tls/server.crt
            - name: ETCD_KEY_PATH
              value: /etc/etcd/tls/server.key
            - name: VAULT_ADDR
              value: "https://vault.fintech.internal:8200"
            - name: VAULT_CACERT
              value: /etc/vault/tls/ca.crt
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: etcd-tls
              mountPath: /etc/etcd/tls
              readOnly: true
            - name: vault-tls
              mountPath: /etc/vault/tls
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
            capabilities:
              drop:
                - ALL
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: config
          configMap:
            name: failover-controller-config
        - name: etcd-tls
          secret:
            secretName: etcd-client-tls
        - name: vault-tls
          secret:
            secretName: vault-client-tls
---
apiVersion: v1
kind: Service
metadata:
  name: failover-controller
  namespace: disaster-recovery
  labels:
    app: failover-controller
spec:
  ports:
    - name: metrics
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: webhook
      port: 8443
      targetPort: 8443
      protocol: TCP
  selector:
    app: failover-controller
  clusterIP: None
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: failover-controller
  namespace: disaster-recovery
  annotations:
    description: "ServiceAccount para el controller de failover"
    owner: "sre-team@fintech.internal"
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: failover-controller-pdb
  namespace: disaster-recovery
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: failover-controller