apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clusterfailovers.fintech.internal
  annotations:
    description: "CRD para definir políticas de failover entre clusters Kubernetes"
    controller-gen.kubebuilder.io/version: v0.14.0
    cert-manager.io/inject-ca-from: "disaster-recovery/failover-controller-cert"
spec:
  group: fintech.internal
  names:
    kind: ClusterFailover
    listKind: ClusterFailoverList
    plural: clusterfailovers
    singular: clusterfailover
    shortNames:
      - cf
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - primaryCluster
                - standbyCluster
                - healthCheckEndpoint
                - failoverStrategy
              properties:
                primaryCluster:
                  type: string
                  description: "Nombre del cluster primario que está fallando"
                standbyCluster:
                  type: string
                  description: "Nombre del cluster standby que promoted"
                healthCheckEndpoint:
                  type: string
                  description: "Endpoint HTTP para health checks del cluster standby"
                failoverStrategy:
                  type: string
                  enum:
                    - automatic
                    - manual-approval
                    - staged
                  default: automatic
                timeoutSeconds:
                  type: integer
                  default: 180
                  description: "Timeout en segundos para el failover (3 minutos por defecto)"
                healthCheckIntervalSeconds:
                  type: integer
                  default: 10
                  description: "Intervalo de verificación de salud"
                healthCheckThreshold:
                  type: integer
                  default: 3
                  description: "Número de fallos consecutivos antes de iniciar failover"
                preFailoverScript:
                  type: string
                  description: "Script o comando a ejecutar antes del failover"
                postFailoverScript:
                  type: string
                  description: "Script o comando a ejecutar después del failover"
                rollbackEnabled:
                  type: boolean
                  default: true
                  description: "Habilitar rollback automático si el failover falla"
                notificationConfig:
                  type: object
                  properties:
                    slackWebhook:
                      type: string
                    emailRecipients:
                      type: array
                      items:
                        type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum:
                    - Idle
                    - HealthChecking
                    - PreFailoverExecuting
                    - FailoverInProgress
                    - PostFailoverExecuting
                    - Completed
                    - Failed
                    - RollingBack
                startTime:
                  type: string
                  format: date-time
                completionTime:
                  type: string
                  format: date-time
                lastHealthCheck:
                  type: string
                  format: date-time
                healthCheckFailures:
                  type: integer
                clusterStatus:
                  type: object
                  properties:
                    primary:
                      type: string
                    standby:
                      type: string
                errorMessage:
                  type: string
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: failover-controller-config
  namespace: disaster-recovery
  annotations:
    description: "Configuración del controller de failover"
data:
  config.yaml: |
    controller:
      leaderElection:
        enabled: true
        leaseDuration: 15s
        renewDeadline: 10s
        retryPeriod: 5s
      metrics:
        enabled: true
        port: 8080
      healthCheck:
        defaultTimeoutSeconds: 180
        defaultIntervalSeconds: 10
        defaultThreshold: 3
        timeoutMultiplier: 1.5
      failover:
        maxRetries: 3
        retryDelaySeconds: 30
        preFailoverGracePeriodSeconds: 30
        postFailoverGracePeriodSeconds: 60
      logging:
        level: info
        format: json
      notification:
        enabled: true
        retryAttempts: 3
        retryDelaySeconds: 10
---
