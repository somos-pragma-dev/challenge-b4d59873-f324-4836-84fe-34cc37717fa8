apiVersion: v1
kind: ConfigMap
metadata:
  name: failover-configuration
  namespace: fleet-management
  labels:
    config.fintech.internal/type: failover
data:
  failover-rules.yaml: |
    failoverPolicies:
      - name: primary-failure-detection
        type: health-check
        clusterSelector: cluster.fintech.internal/role=primary
        checkInterval: 30s
        failureThreshold: 3
        recoveryThreshold: 2
        timeout: 10s
        actions:
          - type: alert
            target: pagerduty
            severity: critical
          - type: execute-failover
            targetClusters:
              - fintech-standby-us-west-2
              - fintech-standby-eu-west-1
              - fintech-standby-ap-southeast-1
              - fintech-standby-eu-central-1
      - name: replication-lag-detection
        type: metric-threshold
        clusterSelector: cluster.fintech.internal/role=standby
        metric: etcd_replication_lag_seconds
        threshold: 10
        evaluationInterval: 15s
        actions:
          - type: alert
            target: slack
            severity: warning
          - type: pause-failover
            reason: "replication-lag-exceeded"
      - name: split-brain-prevention
        type: distributed-lock
        lockName: failover-activation
        lockTimeout: 300s
        consensusRequired: quorum
        regions:
          - us-east-1
          - us-west-2
          - eu-west-1
          - ap-southeast-1
          - eu-central-1
  priority-order.yaml: |
    failoverPriority:
      - cluster: fintech-standby-us-west-2
        priority: 2
        region: us-west-2
        weight: 100
        healthScore: 100
      - cluster: fintech-standby-eu-west-1
        priority: 3
        region: eu-west-1
        weight: 80
        healthScore: 100
      - cluster: fintech-standby-ap-southeast-1
        priority: 4
        region: ap-southeast-1
        weight: 60
        healthScore: 100
      - cluster: fintech-standby-eu-central-1
        priority: 5
        region: eu-central-1
        weight: 40
        healthScore: 100
  replication-config.yaml: |
    replicationSettings:
      mode: async
      syncInterval: 1m
      batchSize: 1000
      compression: snappy
      encryption: tls
      sourceCluster: fintech-primary-us-east-1
      targetClusters:
        - fintech-standby-us-west-2
        - fintech-standby-eu-west-1
        - fintech-standby-ap-southeast-1
        - fintech-standby-eu-central-1
      resources:
        - kind: Secret
          apiVersion: v1
          namespace: "*"
        - kind: ConfigMap
          apiVersion: v1
          namespace: "*"
        - kind: Service
          apiVersion: v1
          namespace: production
        - kind: Ingress
          apiVersion: networking.k8s.io/v1
          namespace: production
        - kind: Deployment
          apiVersion: apps/v1
          namespace: production
        - kind: StatefulSet
          apiVersion: apps/v1
          namespace: production
      filters:
        exclude:
          - field: metadata.annotations
            contains: cluster.fintech.internal/local-only
        include:
          - field: metadata.labels
            contains: cluster.fintech.internal/replicate=true
---
apiVersion: v1
kind: Service
metadata:
  name: failover-coordinator
  namespace: fleet-management
  labels:
    app.fintech.internal: failover-coordinator
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
    - port: 8443
      targetPort: 8443
      name: https
  selector:
    app: failover-coordinator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: failover-coordinator
  namespace: fleet-management
  labels:
    app.fintech.internal: failover-coordinator
spec:
  replicas: 3
  selector:
    matchLabels:
      app: failover-coordinator
  template:
    metadata:
      labels:
        app: failover-coordinator
    spec:
      serviceAccountName: failover-controller
      containers:
        - name: coordinator
          image: fintech/failover-coordinator:v1.0.0
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 8443
              name: https
          env:
            - name: PRIMARY_CLUSTER
              value: fintech-primary-us-east-1
            - name: STANDBY_CLUSTERS
              value: fintech-standby-us-west-2,fintech-standby-eu-west-1,fintech-standby-ap-southeast-1,fintech-standby-eu-central-1
            - name: FAILOVER_TIMEOUT
              value: "300"
            - name: HEALTH_CHECK_INTERVAL
              value: "30"
            - name: REPLICATION_LAG_THRESHOLD
              value: "10"
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: failover-configuration